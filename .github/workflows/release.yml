name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate stable tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== "v"+p.version) throw new Error("tag must match package.json version")'
      - run: make check
      - run: npm run check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: 'v2.19.0'
          args: release --clean --release-notes docs/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
