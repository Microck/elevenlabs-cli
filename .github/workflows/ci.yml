name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify packed installation
        run: |
          mkdir -p "$RUNNER_TEMP/elevenlabs-install"
          archive="$(npm pack --ignore-scripts --silent)"
          npm install --global --prefix "$RUNNER_TEMP/elevenlabs-install" "./$archive"
          "$RUNNER_TEMP/elevenlabs-install/bin/elevenlabs" --version
          "$RUNNER_TEMP/elevenlabs-install/bin/elevenlabs" skills get elevenlabs
